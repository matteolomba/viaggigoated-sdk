openapi: 3.1.0
info:
  title: viaggigoated-backend
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /anywhere:
    get:
      tags:
      - anywhere
      summary: Anywhere
      description: "Tutte le destinazioni con prezzo minimo, ordinate per prezzo.\n\
        \nId posizione SOLO dal suggester `/omio/positions` (mai nomi liberi).\n`modes`\
        \ filtra per mezzo di trasporto; `providers` filtra per operatore\n(es. `flixbus,itabus,italo`)\
        \ sul viaggio pi\xF9 economico di ogni\ndestinazione."
      operationId: anywhere_anywhere_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: From
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: modes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(train|flight|bus)(,(train|flight|bus))*$
          - type: 'null'
          title: Modes
      - name: providers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[a-z0-9]+(,[a-z0-9]+)*$
          - type: 'null'
          title: Providers
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnywhereResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /anywhere/stream:
    get:
      tags:
      - anywhere
      summary: Anywhere Stream
      description: '"Ovunque" in streaming: ogni destinazione arriva appena il provider

        risponde (`event: destination`), poi il riepilogo (`event: done`). La GUI

        si aggiorna man mano, senza aspettare la fine di tutte le ricerche.'
      operationId: anywhere_stream_anywhere_stream_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: From
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: modes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(train|flight|bus)(,(train|flight|bus))*$
          - type: 'null'
          title: Modes
      - name: providers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[a-z0-9]+(,[a-z0-9]+)*$
          - type: 'null'
          title: Providers
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /flights/roundtrip:
    get:
      tags:
      - flights
      summary: Roundtrip
      operationId: roundtrip_flights_roundtrip_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          title: To
      - name: out
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Out
      - name: back
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Back
      - name: window
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Window
      - name: nights
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 30
            minimum: 1
          - type: 'null'
          title: Nights
      - name: travelers
        in: query
        required: false
        schema:
          type: integer
          maximum: 9
          minimum: 1
          default: 1
          title: Travelers
      - name: budget_max_per_person_eur
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
          title: Budget Max Per Person Eur
      - name: earliest_departure_hour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          title: Earliest Departure Hour
      - name: home
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 80
          - type: 'null'
          title: Home
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundtripResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /flights/aggregated:
    get:
      tags:
      - flights
      summary: Aggregated
      operationId: aggregated_flights_aggregated_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          title: To
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/links:
    get:
      tags:
      - admin
      summary: Links
      description: Correlazioni esistenti, con filtri (q sul nome, provider, stato).
      operationId: links_admin_links_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLinkListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - admin
      summary: Create Link
      description: Aggiunta manuale di una correlazione (confermata subito).
      operationId: create_link_admin_links_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationLinkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLinkView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/links/{link_id}/status:
    put:
      tags:
      - admin
      summary: Update Link Status
      description: Conferma o rifiuta una correlazione (anche una proposta).
      operationId: update_link_status_admin_links__link_id__status_put
      security:
      - HTTPBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationLinkStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLinkView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/links/proposals/generate:
    post:
      tags:
      - admin
      summary: Generate
      description: 'Lancia il motore di proposta (idempotente): nascono solo `proposed`.'
      operationId: generate_admin_links_proposals_generate_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalStatsView'
      security:
      - HTTPBearer: []
  /admin/links/proposals:
    get:
      tags:
      - admin
      summary: Proposals
      description: Proposte pendenti, ordinate per confidenza (score).
      operationId: proposals_admin_links_proposals_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: method
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/links/proposals/{link_id}/apply:
    post:
      tags:
      - admin
      summary: Apply Proposal
      description: Applica una proposta singola (la conferma).
      operationId: apply_proposal_admin_links_proposals__link_id__apply_post
      security:
      - HTTPBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLinkView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/token:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: 'Registrazione invite-only: consuma un codice e crea l''utente.'
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/invites:
    get:
      tags:
      - auth
      summary: List Invites
      description: Codici invito generati dall'admin corrente.
      operationId: list_invites_auth_invites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - auth
      summary: Generate Invite
      description: Genera un codice invito (solo admin).
      operationId: generate_invite_auth_invites_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /airports/nearby:
    get:
      tags:
      - airports
      summary: Nearby
      operationId: nearby_airports_nearby_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: From
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          default: 250
          title: Radius Km
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts:
    get:
      tags:
      - alerts
      summary: List Alerts
      operationId: list_alerts_alerts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - alerts
      summary: Create Alert
      operationId: create_alert_alerts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /alerts/{alert_id}:
    delete:
      tags:
      - alerts
      summary: Delete Alert
      operationId: delete_alert_alerts__alert_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: integer
          title: Alert Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /bus/cities:
    get:
      tags:
      - bus
      summary: Cities
      description: "Autocompletamento citt\xE0 (selezione per la ricerca: id UUID\
        \ stabili)."
      operationId: cities_bus_cities_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10
          minimum: 1
          default: 5
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusCityListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /bus/search:
    get:
      tags:
      - bus
      summary: Search Bus
      description: "Viaggi con prezzo per persona, ordinati per partenza.\n\nId citt\xE0\
        \ SOLO dall'autocomplete `/bus/cities` (mai nomi liberi)."
      operationId: search_bus_bus_search_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: To
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: adults
        in: query
        required: false
        schema:
          type: integer
          maximum: 9
          minimum: 1
          default: 1
          title: Adults
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations:
    get:
      tags:
      - destinations
      summary: Destinations
      operationId: destinations_destinations_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 80
          title: From
      - name: window
        in: query
        required: true
        schema:
          type: string
          minLength: 19
          maxLength: 21
          title: Window
      - name: nights
        in: query
        required: true
        schema:
          type: integer
          maximum: 30
          minimum: 1
          title: Nights
      - name: travelers
        in: query
        required: false
        schema:
          type: integer
          maximum: 9
          minimum: 1
          default: 1
          title: Travelers
      - name: country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
            pattern: ^[A-Za-z]{2}$
          - type: 'null'
          title: Country
      - name: budget_max_per_person_eur
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
          title: Budget Max Per Person Eur
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/viaggigoated__api__destinations__DestinationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /diagnostics/metrics:
    get:
      tags:
      - diagnostics
      summary: Metrics
      operationId: metrics_diagnostics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsView'
  /local-hop:
    get:
      tags:
      - local-hop
      summary: Local Hop
      operationId: local_hop_local_hop_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: To
      - name: mode
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 10
          title: Mode
      - name: travelers
        in: query
        required: false
        schema:
          type: integer
          maximum: 9
          minimum: 1
          default: 1
          title: Travelers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalHopView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-hop/rates:
    get:
      tags:
      - local-hop
      summary: List Rates
      operationId: list_rates_local_hop_rates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesResponse'
    put:
      tags:
      - local-hop
      summary: Update Rate
      operationId: update_rate_local_hop_rates_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations:
    get:
      tags:
      - locations
      summary: Locations
      description: Autocompletamento sul catalogo unificato (treni, bus, aerei).
      operationId: locations_locations_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: Q
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(train_station|bus_station|bus_city|airport)$
          - type: 'null'
          title: Kind
      - name: country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
            pattern: ^[A-Za-z]{2}$
          - type: 'null'
          title: Country
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /notifications/stream:
    get:
      tags:
      - notifications
      summary: Stream
      description: 'Stream SSE: eventi `price_alert` per l''utente del token.'
      operationId: stream_notifications_stream_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          minLength: 8
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /itabus/stations:
    get:
      tags:
      - itabus
      summary: Stations
      operationId: stations_itabus_stations_get
      parameters:
      - name: country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
          - type: 'null'
          title: Country
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
