[project]
name = "viaggigoated-sdk"
version = "1.0.0"
description = "SDK Python per viaggigoated — client tipato su openapi.yaml"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]
authors = [{name="Matteo Lombardi", email="matteo@lomba.dev"}]

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest", "schemathesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
typeCheckingMode = "strict"
