      - name: fuel
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 32
          - type: 'null'
          title: Fuel
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelStationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /weather/forecast:
    get:
      tags:
      - weather
      summary: Forecast
      description: "Previsioni meteo giornaliere per lat/lon e finestra inclusa con\
        \ pi\xF9 modelli EU.\n\nFinestra max 7 giorni (OPENMETEO_MAX_DAYS): oltre\
        \ -> 400 con limite\nesplicito (RNF-05). Date passate ammesse. Aggrega Open-Meteo\
        \ (ECMWF/DWD/M\xE9t\xE9o-France)\ne Met Norway (European, gratis) \u2014 per\
        \ itinerario valuta meteo: pioggia >5mm \u2192 warning indoor.\nSe uno fallisce,\
        \ l'altro copre (mai 500)."
      operationId: forecast_weather_forecast_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitudine
          title: Lat
        description: Latitudine
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitudine
          title: Lon
        description: Longitudine
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: YYYY-MM-DD, inizio finestra
          title: Start Date
        description: YYYY-MM-DD, inizio finestra
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: YYYY-MM-DD, fine finestra
          title: End Date
        description: YYYY-MM-DD, fine finestra
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherForecastResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
